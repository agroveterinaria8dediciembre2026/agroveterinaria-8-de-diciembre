<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b43"><link rel="manifest" href="manifest.json"><title>Agroveterinaria 8 de Diciembre</title><style>body{font:16px system-ui;margin:0;background:#f3f7f4;color:#183329}header{background:#176b43;color:white;padding:18px}main{max-width:850px;margin:auto;padding:12px}nav{display:flex;gap:5px;overflow:auto;padding:8px 0}button{background:#176b43;color:white;border:0;border-radius:8px;padding:11px;cursor:pointer}nav button{white-space:nowrap}section{background:white;padding:15px;border-radius:12px;margin:10px 0;box-shadow:0 1px 4px #0001}label{display:block;margin:9px 0}input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bbb;border-radius:7px;font-size:16px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left} .scroll{overflow:auto}.muted{color:#65756b;font-size:13px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cards article{padding:13px;background:#e8f3eb;border-radius:8px}strong{display:block;font-size:19px} .danger{color:#a22} .hide{display:none}</style></head><body><header><b>🌱 Agroveterinaria 8 de Diciembre</b><div class="muted" style="color:#d6f2df">Sistema de prueba · Datos guardados en este dispositivo</div></header><main><nav id="nav"></nav><div id="content"></div></main><script>
const K='agro8_demo_v1';let db;try{db=JSON.parse(localStorage.getItem(K))||null}catch{}db=db||{products:[],clients:[],sales:[],payments:[],expenses:[],purchases:[]};const money=n=>'Gs. '+Math.round(Number(n)||0).toLocaleString('es-PY');const save=()=>localStorage.setItem(K,JSON.stringify(db));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>Number(x)||0;const date=()=>new Date().toLocaleDateString('en-CA');let tab='Resumen';const tabs=['Usuarios','Resumen','Productos','Compras','Ventas','Clientes y fiados','Gastos','Respaldo'];const AUTHKEY='agro8_users_demo';let users=JSON.parse(localStorage.getItem(AUTHKEY)||'null')||[];let active=null;let audit=JSON.parse(localStorage.getItem('agro8_audit_demo')||'[]');const saveUsers=()=>localStorage.setItem(AUTHKEY,JSON.stringify(users));const saveAudit=()=>localStorage.setItem('agro8_audit_demo',JSON.stringify(audit));async function digest(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}const prod=id=>db.products.find(x=>x.id===id);const client=id=>db.clients.find(x=>x.id===id);const balance=c=>db.sales.filter(s=>s.clientId===c&&s.type==='fiado').reduce((a,s)=>a+s.total,0)-db.payments.filter(p=>p.clientId===c).reduce((a,p)=>a+p.amount,0);function form(fields,button){return `<form id="form">${fields}<button>${button}</button></form>`}function field(label,name,type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" ${extra} required></label>`}function options(arr){return arr.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}function show(t=tab){if(!active){loginScreen();return}tab=t;document.getElementById('nav').innerHTML=tabs.map(x=>`<button onclick="show('${x}')" style="opacity:${x===t?1:.65}">${x}</button>`).join('');let html='';let month=date().slice(0,7);let sales=db.sales.filter(x=>x.date.startsWith(month));let rev=sales.reduce((a,x)=>a+x.total,0),cost=sales.reduce((a,x)=>a+x.cost,0),expenses=db.expenses.filter(x=>x.date.startsWith(month)).reduce((a,x)=>a+x.amount,0);if(t==='Usuarios'){html=`<section><h2>Usuarios (modo demostración)</h2><p>Sesión: <b>${esc(active.name)}</b> (${active.role==='admin'?'Administrador':'Empleado'})</p><button onclick="active=null;loginScreen()">Cerrar sesión</button><p class="danger">Las cuentas se guardan solo en este navegador. No son seguridad real ni funcionan entre dispositivos.</p>${active.role==='admin'?`<h3>Crear empleados (máximo 3)</h3><form id="newuser">${field('Nombre de usuario','username')}${field('Contraseña (mínimo 6 caracteres)','password','password','minlength="6"')}<button>Crear empleado</button></form>`:''}<h3>Cuentas</h3>${users.map(u=>`<p>${esc(u.name)} · ${u.role==='admin'?'Administrador':'Empleado'}</p>`).join('')}<h3>Registro de descuentos autorizados</h3>${audit.slice().reverse().slice(0,30).map(a=>`<p>${esc(a.date)} · ${esc(a.employee)} · ${a.discount}% · Autorizó: ${esc(a.admin)}</p>`).join('')||'Sin registros.'}</section>`}if(t==='Resumen'){let owed=db.clients.reduce((a,c)=>a+balance(c.id),0);html=`<section><h2>Resumen de ${month}</h2><div class="cards"><article>Ventas<strong>${money(rev)}</strong></article><article>Ganancia bruta<strong>${money(rev-cost)}</strong></article><article>Gastos<strong>${money(expenses)}</strong></article><article>Ganancia estimada<strong>${money(rev-cost-expenses)}</strong></article><article>Por cobrar<strong>${money(owed)}</strong></article><article>Productos<strong>${db.products.length}</strong></article></div><p class="muted">Ganancia estimada = ventas − costo registrado de mercadería vendida − gastos. Incluye ventas fiadas; no representa dinero cobrado ni impuestos.</p></section><section><h3>Stock bajo</h3>${db.products.filter(p=>p.stock<=p.min).map(p=>`<p class="danger">${esc(p.name)}: ${p.stock} ${esc(p.unit)}</p>`).join('')||'Sin alertas'}</section>`}
if(t==='Productos'){html=`<section><h2>Nuevo producto</h2>${form(field('Nombre','name')+field('Unidad (bolsa, unidad, litro, kg)','unit')+field('Costo unitario (Gs.)','cost','number','min="0" step="0.01"')+field('Precio de venta (Gs.)','price','number','min="0" step="0.01"')+field('Stock inicial','stock','number','min="0" step="0.001"')+field('Stock mínimo','min','number','min="0" step="0.001"'),'Guardar producto')}</section><section><h3>Inventario</h3><div class="scroll"><table><tr><th>Producto</th><th>Stock</th><th>Costo</th><th>Venta</th></tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock} ${esc(p.unit)}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td></tr>`).join('')}</table></div></section>`}
if(t==='Compras'){html=`<section><h2>Ingresar mercadería</h2>${db.products.length?form(`<label>Producto<select name="productId">${options(db.products)}</select></label>`+field('Cantidad recibida','qty','number','min="0.001" step="0.001"')+field('Costo unitario de esta compra (Gs.)','cost','number','min="0" step="0.01"'),'Registrar compra'):'Primero cargá un producto.'}</section><section><h3>Últimas compras</h3>${db.purchases.slice().reverse().slice(0,30).map(x=>`<p>${x.date}: ${esc(prod(x.productId)?.name||'Producto')} · ${x.qty} · ${money(x.qty*x.cost)}</p>`).join('')}</section>`}
if(t==='Ventas'){html=`<section><h2>Registrar venta</h2>${db.products.length?form(`<label>Producto<select name="productId">${options(db.products)}</select></label>`+field('Cantidad','qty','number','min="0.001" step="0.001"')+`<label>Descuento (%)<input name="discount" type="number" min="0" max="100" step="0.01" value="0" required></label><p>Empleado responsable: <b>${esc(active.name)}</b></p><label>Si supera el 10 %, usuario administrador<input name="approval" placeholder="Usuario administrador"></label><label>Contraseña del administrador para autorizar<input name="approvalPassword" type="password" placeholder="Solo para descuentos mayores al 10 %"></label><label>Tipo de venta<select name="type" onchange="document.getElementById('clientwrap').style.display=this.value==='fiado'?'block':'none'"><option value="contado">Contado / transferencia</option><option value="fiado">Fiado</option></select></label><div id="clientwrap" style="display:none"><label>Cliente<select name="clientId"><option value="">Elegir cliente</option>${options(db.clients)}</select></label></div>`,'Registrar venta'):'Primero cargá productos.'}<p class="muted">Esta versión registra un producto por venta. El descuento modifica el total y la ganancia. IMPORTANTE: las credenciales se comprueban solo en este dispositivo. Esta demostración NO constituye control de seguridad real.</p></section><section><h3>Últimas ventas</h3>${db.sales.slice().reverse().slice(0,30).map(s=>`<p>${s.date} · ${esc(prod(s.productId)?.name||'Producto')} (${s.qty}) · ${money(s.total)} · ${s.type==='fiado'?'Fiado':'Contado'} · Descuento ${s.discount||0}% · ${esc(s.employee||'Sin registrar')}${s.approval?' · Autorizó: '+esc(s.approval):''}</p>`).join('')}</section>`}
if(t==='Clientes y fiados'){html=`<section><h2>Nuevo cliente</h2>${form(field('Nombre','name')+field('Teléfono','phone','tel'),'Guardar cliente')}</section><section><h2>Registrar pago de fiado</h2>${db.clients.length?form(`<label>Cliente<select name="clientId">${options(db.clients)}</select></label>`+field('Monto abonado (Gs.)','amount','number','min="1" step="1"'),'Registrar pago'):'Primero cargá un cliente.'}</section><section><h3>Saldos pendientes</h3>${db.clients.map(c=>`<p>${esc(c.name)} · ${esc(c.phone)} <strong>${money(balance(c.id))}</strong></p>`).join('')||'Sin clientes.'}</section>`}
if(t==='Gastos'){html=`<section><h2>Nuevo gasto</h2>${form(field('Concepto','concept')+field('Importe (Gs.)','amount','number','min="1" step="1"'),'Registrar gasto')}</section><section>${db.expenses.slice().reverse().slice(0,30).map(x=>`<p>${x.date} · ${esc(x.concept)} · ${money(x.amount)}</p>`).join('')}</section>`}
if(t==='Respaldo'){html=`<section><h2>Respaldo de datos</h2><p>Descargá una copia periódicamente. Los datos de esta prueba solo están guardados en este navegador; no se sincronizan con otros dispositivos.</p><button onclick="backup()">Descargar respaldo JSON</button><label>Restaurar respaldo<input type="file" accept=".json,application/json" onchange="restore(this)"></label><p class="danger">Restaurar reemplaza todos los datos actuales de este dispositivo.</p></section>`}
document.getElementById('content').innerHTML=html;let f=document.getElementById('form');if(t==='Usuarios'){let uf=document.getElementById('newuser');if(uf)uf.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(uf));if(users.length>=4)return alert('Máximo de 3 empleados');if(users.some(u=>u.name.toLowerCase()===v.username.trim().toLowerCase()))return alert('Usuario existente');users.push({name:v.username.trim(),role:'employee',hash:await digest(v.password)});saveUsers();show()}}if(f)f.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(f).entries());try{if(t==='Productos'){if(db.products.some(p=>p.name.toLowerCase()===v.name.trim().toLowerCase()))throw Error('Ya existe un producto con ese nombre');db.products.push({id:id(),name:v.name.trim(),unit:v.unit.trim(),cost:num(v.cost),price:num(v.price),stock:num(v.stock),min:num(v.min)})}if(t==='Compras'){let p=prod(v.productId);if(!p)throw Error('Producto no encontrado');let q=num(v.qty),c=num(v.cost);if(q<=0||c<0)throw Error('Cantidad o costo inválido');p.cost=(p.stock*p.cost+q*c)/(p.stock+q);p.stock+=q;db.purchases.push({id:id(),date:date(),productId:p.id,qty:q,cost:c})}if(t==='Ventas'){let p=prod(v.productId),q=num(v.qty);if(!p||q<=0||q>p.stock)throw Error('Stock insuficiente o cantidad inválida');if(v.type==='fiado'&&!client(v.clientId))throw Error('Elegí un cliente para la venta fiada');let discount=num(v.discount);if(discount<0||discount>100)throw Error('Descuento inválido');if(discount>10){let admin=users.find(u=>u.role==='admin'&&u.name.toLowerCase()===String(v.approval||'').trim().toLowerCase());if(!admin||!v.approvalPassword||await digest(v.approvalPassword)!==admin.hash)throw Error('Se requiere usuario y contraseña válidos del administrador');audit.push({date:date(),employee:active.name,discount,admin:admin.name});saveAudit()}p.stock=Math.round((p.stock-q)*1000)/1000;db.sales.push({id:id(),date:date(),productId:p.id,qty:q,total:Math.round(q*p.price*(1-discount/100)),originalTotal:q*p.price,discount,employee:active.name,approval:discount>10?v.approval.trim():null,cost:q*p.cost,type:v.type,clientId:v.type==='fiado'?v.clientId:null})}if(t==='Clientes y fiados'){if(v.amount!==undefined){let amount=num(v.amount),bal=balance(v.clientId);if(amount<=0||amount>bal)throw Error('El abono debe ser mayor que cero y no superar la deuda');db.payments.push({id:id(),date:date(),clientId:v.clientId,amount})}else db.clients.push({id:id(),name:v.name.trim(),phone:v.phone.trim()})}if(t==='Gastos'){if(num(v.amount)<=0)throw Error('Importe inválido');db.expenses.push({id:id(),date:date(),concept:v.concept,amount:num(v.amount)})}save();alert('Guardado correctamente');show()}catch(err){alert(err.message)}}}
function loginScreen(){document.getElementById('nav').innerHTML='';document.getElementById('content').innerHTML=users.length?`<section><h2>Ingresar al sistema</h2><form id="login">${field('Usuario','username')}${field('Contraseña','password','password')}<button>Ingresar</button></form><p class="danger">Modo de prueba: usuarios locales, sin sincronización ni seguridad de servidor.</p></section>`:`<section><h2>Configurar administrador</h2><p>Creá tu cuenta de prueba. Usá una contraseña diferente de las que utilizás en otros servicios.</p><form id="setup">${field('Nombre de usuario administrador','username')}${field('Contraseña (mínimo 6 caracteres)','password','password','minlength="6"')}<button>Crear administrador</button></form><p class="danger">Esta cuenta se almacena en el navegador y no protege los datos frente a personas con acceso al dispositivo.</p></section>`;let f=document.querySelector('#login,#setup');f.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(f));if(f.id==='setup'){users=[{name:v.username.trim(),role:'admin',hash:await digest(v.password)}];saveUsers();active=users[0];show('Usuarios')}else{let u=users.find(u=>u.name.toLowerCase()===v.username.trim().toLowerCase());if(!u||u.hash!==await digest(v.password))return alert('Usuario o contraseña incorrectos');active=u;show('Resumen')}}}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='respaldo_agroveterinaria_'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){let f=el.files[0];if(!f||!confirm('¿Reemplazar TODOS los datos actuales por el respaldo?'))return;try{let x=JSON.parse(await f.text());if(!['products','clients','sales','payments','expenses','purchases'].every(k=>Array.isArray(x[k])))throw Error('Archivo no válido');db=x;save();show();alert('Respaldo restaurado')}catch(e){alert('Error al restaurar: '+e.message)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});loginScreen();</script></body></html>
